---
- name: Установка Docker и Docker Compose
  ansible.builtin.import_tasks: install_docker.yml
  tags: [deploy, prepare]

- name: Клонирование репозиториев
  ansible.builtin.import_tasks: clone_repos.yml
  tags: [deploy, prepare]

- name: Запуск микросервисов
  ansible.builtin.import_tasks: compose_up.yml
  tags: [deploy, start]

- name: Остановка микросервисов
  ansible.builtin.import_tasks: compose_down.yml
  tags: [stop, never]