---
- name: Установить зависимости (в том числе git)
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Создать каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачать GPG-ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Добавить официальный репозиторий Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Установить Docker Engine и Docker Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Включить и запустить службу docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Добавить пользователя в группу docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Настроить ротацию логов Docker (шаблон)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Применить handler сразу
  ansible.builtin.meta: flush_handlers

- name: Проверить версию Docker Compose
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Показать версию Docker Compose
  ansible.builtin.debug:
    msg: "{{ compose_version.stdout }}"